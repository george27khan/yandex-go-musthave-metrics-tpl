
name: go vet test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  statictest:
    runs-on: ubuntu-latest
    container: golang:1.26.5

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Download statictest binary
        uses: robinraju/release-downloader@v1.8
        with:
          repository: Yandex-Practicum/go-autotests
          tag: v0.13.8
          fileName: statictest
          out-file-path: .tools
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup autotest binary
        run: |
          chmod +x .tools/statictest
          mv .tools/statictest /usr/local/bin/statictest

      - name: Run statictest
        env:
          GOTOOLCHAIN: local
        run: |
          echo "=== Go version ==="
          go version
          go env GOVERSION GOTOOLCHAIN GOROOT

          echo "=== statictest ==="
          ls -lh /usr/local/bin/statictest

          echo "=== Run vet ==="
          go vet -vettool=/usr/local/bin/statictest ./...
